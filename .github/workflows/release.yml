name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26.5"
  GORELEASER_VERSION: v2.17.1
  GOMOBILE_VERSION: latest
  TASK_VERSION: 3.52.0

jobs:
  build-ios:
    name: Build iOS XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-task@v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          gomobile init

      - name: Build XCFramework
        run: task build:ios

      - name: Zip XCFramework
        run: cd dist && zip -r Mobile.xcframework.zip Mobile.xcframework

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-xcframework-zip
          path: dist/Mobile.xcframework.zip
          retention-days: 7

  build-desktop-macos:
    name: Build desktop client (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build client+xray for desktop embed (macOS)
        run: |
          mkdir -p cmd/desktop/embedded/darwin_amd64 cmd/desktop/embedded/darwin_arm64
          rm -f cmd/desktop/embedded/darwin_amd64/client cmd/desktop/embedded/darwin_arm64/client cmd/desktop/embedded/darwin_amd64/xray cmd/desktop/embedded/darwin_arm64/xray
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -checklinkname=0" -o cmd/desktop/embedded/darwin_amd64/client ./cmd/client
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -checklinkname=0" -o cmd/desktop/embedded/darwin_arm64/client ./cmd/client
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o cmd/desktop/embedded/darwin_amd64/xray github.com/xtls/xray-core/main
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o cmd/desktop/embedded/darwin_arm64/xray github.com/xtls/xray-core/main

      - name: Build vkturn-desktop for macOS
        env:
          CGO_ENABLED: 1
        run: |
          # Hardcoded, not the tag: cmd/desktop versions independently of the
          # repo's shared tag - see .goreleaser.yaml's desktop build for why.
          # Keep this in sync with that file's ldflags by hand.
          VERSION="1.0.0"
          mkdir -p dist-desktop-macos
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist-desktop-macos/vkturn-desktop-darwin-amd64 ./cmd/desktop
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist-desktop-macos/vkturn-desktop-darwin-arm64 ./cmd/desktop

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-macos-dist
          path: dist-desktop-macos/
          retention-days: 7

  build-android:
    name: Build Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-task@v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Android NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/*/ 2>/dev/null | sort -V | tail -n1)
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          gomobile init

      - name: Build AAR
        run: task build:android

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-aar
          path: dist/mobile.aar
          retention-days: 7

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [build-ios, build-android, build-desktop-macos]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: docker/setup-qemu-action@v4.0.0

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0.24.0

      # desktop's Linux build needs CGO for the system tray (AppIndicator
      # backend, github.com/getlantern/systray) - see .goreleaser.yaml's
      # desktop build override.
      - name: Install Linux tray build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libayatana-appindicator3-dev libgtk-3-dev

      - uses: actions/download-artifact@v7.0.0
        with:
          name: ios-xcframework-zip
          path: mobile-dist/

      - uses: actions/download-artifact@v7.0.0
        with:
          name: android-aar
          path: mobile-dist/

      - uses: actions/download-artifact@v7.0.0
        with:
          name: desktop-macos-dist
          path: desktop-macos-dist/

      # cmd/desktop embeds client/xray/wintun.dll via go:embed (see
      # cmd/desktop/embed_linux.go, embed_windows.go, extract.go) and
      # extracts them to ~/.vkturn/bin/ on first run - so the payload has
      # to exist under cmd/desktop/embedded/<goos>_<goarch>/ before
      # goreleaser's own `go build ./cmd/desktop` below runs, or it embeds
      # empty placeholders. This step populates the `client` half; the
      # "Build xray CLI" and "Fetch wintun.dll" steps below populate the
      # rest.
      - name: Build client for desktop embed
        run: |
          mkdir -p cmd/desktop/embedded/linux_amd64 cmd/desktop/embedded/windows_amd64
          # The committed placeholders at these exact paths (see
          # cmd/desktop/embedded/README.md) are plain text, not Go objects -
          # `go build -o` refuses to overwrite an existing file it doesn't
          # recognize as its own prior output ("already exists and is not
          # an object file"), so a fresh checkout's build would fail here
          # without removing them first.
          rm -f cmd/desktop/embedded/linux_amd64/client cmd/desktop/embedded/windows_amd64/client.exe
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w -checklinkname=0" -o cmd/desktop/embedded/linux_amd64/client        ./cmd/client
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -checklinkname=0" -o cmd/desktop/embedded/windows_amd64/client.exe ./cmd/client

      # cmd/desktop shells out to a separate `xray` binary (RunXray in
      # launcher.go) - previously never published, forcing manual sourcing
      # from upstream Xray-core (see resolveXrayBin's doc comment). Built
      # here from this repo's own pinned xtls/xray-core dependency to stay
      # in lockstep with whatever libxray-based config generation cmd/desktop
      # uses. Plain `go build`, not goreleaser's builds section: goreleaser's
      # build.main is filesystem-path/stat-based and can't target an
      # external module's package. Pure Go (no CGO, no build tags -
      # xray-core's main.go already blank-imports main/distro/all, same as
      # upstream's official build), so this cross-compiles all 4 targets
      # from the ubuntu-latest runner directly. Also copies the two targets
      # cmd/desktop embeds into cmd/desktop/embedded/ (see the "Build client
      # for desktop embed" step above).
      - name: Build xray CLI
        run: |
          mkdir -p xray-dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o xray-dist/xray-linux-amd64        github.com/xtls/xray-core/main
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o xray-dist/xray-windows-amd64.exe github.com/xtls/xray-core/main
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o xray-dist/xray-darwin-amd64      github.com/xtls/xray-core/main
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o xray-dist/xray-darwin-arm64      github.com/xtls/xray-core/main
          cp xray-dist/xray-linux-amd64        cmd/desktop/embedded/linux_amd64/xray
          cp xray-dist/xray-windows-amd64.exe  cmd/desktop/embedded/windows_amd64/xray.exe

      # xray-core's `tun` inbound (used by vk-turn (tun) mode, see
      # cmd/desktop/tun.go) needs wintun.dll next to xray.exe at runtime on
      # Windows - it's the TUN driver, not something Go can statically link.
      # Fetched from upstream (wintun.net) and pinned by hash rather than
      # vendored, same reasoning as the xray CLI build above: stay off a
      # binary blob in the repo, verify what actually ships.
      - name: Fetch wintun.dll
        run: |
          mkdir -p wintun-dist
          curl -fsSL -o /tmp/wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  /tmp/wintun.zip" | sha256sum -c -
          unzip -p /tmp/wintun.zip wintun/bin/amd64/wintun.dll > wintun-dist/wintun.dll
          cp wintun-dist/wintun.dll cmd/desktop/embedded/windows_amd64/wintun.dll

      - name: Mark desktop-embed placeholders as intentionally overwritten
        run: |
          # goreleaser's release pipe aborts on a dirty git tree; these five
          # tracked placeholders (see cmd/desktop/embedded/README.md) are
          # *supposed* to be overwritten by the population steps above.
          # --skip-worktree hides the local modification from `git status`
          # without touching the working file goreleaser's `go build` reads.
          git update-index --skip-worktree \
            cmd/desktop/embedded/linux_amd64/client \
            cmd/desktop/embedded/linux_amd64/xray \
            cmd/desktop/embedded/windows_amd64/client.exe \
            cmd/desktop/embedded/windows_amd64/xray.exe \
            cmd/desktop/embedded/windows_amd64/wintun.dll

      - uses: goreleaser/goreleaser-action@v7.2.2
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

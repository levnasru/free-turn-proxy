# GoReleaser config: https://goreleaser.com
version: 2

project_name: free-turn-proxy

before:
  hooks:
    - go mod download

builds:
  # Core VK-TURN client — pure Go, no CGO.
  - id: vkturn
    main: ./cmd/client
    binary: vkturn
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -checklinkname=0 -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_386
      - linux_arm64
      - linux_arm_7
      - windows_amd64
      - windows_386
      - windows_arm64

  # Android client for Android app shipment
  - id: client-android
    main: ./cmd/client
    binary: libfreeturn.so
    no_unique_dist_dir: false
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -checklinkname=0 -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    targets:
      - android_arm64

archives:
  # Android .so binary directly
  - id: android
    ids:
      - client-android
    formats: [binary]
    name_template: "libfreeturn-{{ .Version }}-android-{{ .Arch }}"

  # Raw binaries for vkturn
  - id: raw
    ids:
      - vkturn
    formats: [binary]
    name_template: >-
      {{ .Binary }}-{{ .Os }}-{{ .Arch }}
      {{- with .Arm }}v{{ . }}{{ end }}

  # Backwards compatibility names for Android build task and existing scripts
  - id: raw-compat
    ids:
      - vkturn
    formats: [binary]
    name_template: >-
      client-{{ .Os }}-{{ .Arch }}
      {{- with .Arm }}v{{ . }}{{ end }}

  # Android client raw binary
  - id: raw-android
    ids:
      - client-android
    formats: [binary]
    name_template: "client-{{ .Os }}-{{ .Arch }}"

  - id: raw-android-vkturn
    ids:
      - client-android
    formats: [binary]
    name_template: "vkturn-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: "Breaking Changes"
      regexp: '^.*?break(\(.+?\))??!?:.+$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat(\(.+?\))??!?:.+$'
      order: 10
    - title: "Bug Fixes"
      regexp: '^.*?fix(\(.+?\))??!?:.+$'
      order: 20
    - title: "Performance"
      regexp: '^.*?perf(\(.+?\))??!?:.+$'
      order: 30
    - title: "Refactoring"
      regexp: '^.*?refactor(\(.+?\))??!?:.+$'
      order: 40
    - title: "Other"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^style:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  prerelease: auto
  mode: replace
  draft: false
  name_template: "{{ .ProjectName }} {{ .Version }}"
